name: Build and release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
  workflow_dispatch:

env:
  MAA_FRAMEWORK_VERSION: "v5.10.5"
  MXU_VERSION: "v2.1.3"

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve build version
        id: set_tag
        shell: python
        env:
          UPSTREAM_URL: https://github.com/1bananachicken/MaaNTE.git
        run: |
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          version_pattern = re.compile(r"v\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?")
          ref = os.environ["GITHUB_REF"]
          source_sha = git("rev-parse", "HEAD")
          is_release = ref.startswith("refs/tags/")
          if is_release:
              tag = ref.removeprefix("refs/tags/")
              if not version_pattern.fullmatch(tag):
                  raise SystemExit(f"Invalid release version tag: {tag}")
          else:
              # 使用独立命名空间，避免上游标签覆盖 fork 自己的标签。
              subprocess.run(
                  [
                      "git", "fetch", "--no-tags", "--no-recurse-submodules",
                      os.environ["UPSTREAM_URL"], "refs/tags/v*:refs/tags/upstream/v*",
                  ],
                  check=True,
              )
              refs = git("for-each-ref", "--merged=HEAD", "--format=%(refname:strip=2)", "refs/tags")
              candidates = [
                  name for name in refs.splitlines()
                  if version_pattern.fullmatch(name.removeprefix("upstream/"))
              ]
              if not candidates:
                  raise SystemExit("No valid ancestor version tag found; refusing to use a placeholder version.")
              matches = [arg for name in candidates for arg in ("--match", name)]
              base_tag = git(
                  "describe", "--tags", "--abbrev=0", f"--candidates={len(candidates)}", *matches, "HEAD"
              ).removeprefix("upstream/")
              separator = "." if "-" in base_tag else "-"
              date = datetime.now(timezone.utc).strftime("%y%m%d")
              short_sha = git("rev-parse", "--short=7", "HEAD")
              tag = f"{base_tag}{separator}ci.{date}-{short_sha}"

          is_prerelease = "-" in tag
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
              output.write(f"is_release={str(is_release).lower()}\n")
              output.write(f"is_prerelease={str(is_prerelease).lower()}\n")
              output.write(f"source_sha={source_sha}\n")
          print(f"Build version: {tag}\nSource commit: {source_sha}")
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}
      source_sha: ${{ steps.set_tag.outputs.source_sha }}

  windows:
    needs: meta
    env:
      BUILD_VERSION: ${{ needs.meta.outputs.tag }}
      SOURCE_SHA: ${{ needs.meta.outputs.source_sha }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set platform variables
        id: platform
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            echo "tag=x64" >> $GITHUB_OUTPUT
          else
            echo "tag=arm64" >> $GITHUB_OUTPUT
          fi

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-win-${{ matrix.arch }}*"
          tag: ${{ env.MAA_FRAMEWORK_VERSION }}
          out-file-path: "deps"
          extract: true
      
      - name: Download MXU
        id: download_mxu
        uses: robinraju/release-downloader@v1
        with:
          repository: MistEO/MXU
          fileName: "MXU-win-${{ matrix.arch }}*"
          tag: ${{ env.MXU_VERSION }}
          out-file-path: "MXU"
          extract: true

      - name: Clean up MXU archive on Windows
        shell: bash
        run: |
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_mxu.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"
          echo "Archive cleanup command executed for MXU on Windows."

      - name: Convert PNG to ICO
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          # 安装 ImageMagick
          choco install imagemagick -y

          # 转换 PNG 到 ICO
          magick convert assets/logo.png -define icon:auto-resize=256,128,64,48,32,24,16 maante.ico

      - name: Modify Windows exe icons
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          # 下载 rcedit
          curl -L https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -o rcedit.exe

          # 修改 MXU 图标（如果存在）
          if [ -f "MXU/mxu.exe" ]; then
            ./rcedit.exe "MXU/mxu.exe" --set-icon "maante.ico"
            echo "MXU icon modified successfully"
          else
            echo "MXU exe not found, skipping icon update."
          fi

      - name: Setup Embed Python on Windows
        shell: bash
        run: |
          python tools/ci/setup_embed_python.py

      - name: Download Python dependencies
        shell: bash
        run: |
          ./install/python/python.exe tools/ci/download_deps.py --deps-dir install/deps
      
      - name: Create MXU version
        shell: bash
        run: |
          ./install/python/python.exe ./tools/ci/install_mxu.py "$BUILD_VERSION"
          cp -rpvn install/python/. install-mxu/python/
          if [ -d "install/deps" ]; then
            cp -rpvn install/deps/. install-mxu/deps/
          fi

      - name: Pre-install all dependencies
        shell: bash
        run: |
          echo "Pre-installing all dependencies into embedded Python..."
          ./install-mxu/python/python.exe -m pip install \
            --no-index \
            --find-links install-mxu/deps \
            -r requirements.txt

      - name: Install and patch soundcard
        shell: bash
        run: |
          echo "Installing soundcard into embedded Python..."
          ./install-mxu/python/python.exe -m pip install \
            --no-index \
            --find-links install-mxu/deps \
            soundcard

          echo "Patching soundcard ole32 → ole32.dll..."
          ./install-mxu/python/python.exe - << 'PYEOF'
          import sys, soundcard
          from pathlib import Path
          p = Path(soundcard.__path__[0]) / 'mediafoundation.py'
          c = p.read_text()
          if "_ffi.dlopen('ole32')" not in c:
              print(f'ERROR: expected ole32 patch target not found in {p}. soundcard may have changed.')
              sys.exit(1)
          c = c.replace("_ffi.dlopen('ole32')", "_ffi.dlopen('ole32.dll')")
          p.write_text(c)
          print('Patched:', p)
          PYEOF

          echo "Removing soundcard wheel from deps to prevent re-install..."
          rm -f install-mxu/deps/soundcard-*.whl

      - name: Copy MXU files to MXU version
        shell: bash
        run: |
          if [ -d "MXU" ]; then
            echo "Copying MXU files to install-mxu directory..."
            mkdir -p install-mxu
            if [ -f "MXU/mxu.exe" ]; then
              cp MXU/mxu.exe install-mxu/MaaNTE.exe
            elif [ -f "MXU/mxu" ]; then
              cp MXU/mxu install-mxu/MaaNTE
            fi
          else
            echo "MXU directory not found, skipping copy."
          fi

      - name: Copy custom icons
        shell: bash
        run: |
          # MXU 版本的图标
          if [ -f "maante.ico" ]; then
            cp maante.ico install-mxu/logo.ico
          fi

      - name: Remove deps directory to reduce package size
        shell: bash
        run: |
          echo "Removing deps directory to reduce package size..."
          rm -rf install-mxu/deps
          echo "Deps directory removed. Package size reduced by ~171MB."

      - name: Verify build output
        shell: python
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          output = Path("install-mxu")
          required = [
              "MaaNTE.exe",
              "interface.json",
              "python/python.exe",
              "agent/main.py",
              "maafw/MaaFramework.dll",
              "resource/base/model/ocr/det.onnx",
              "resource/base/model/ocr/rec.onnx",
              "resource/base/model/ocr/keys.txt",
          ]
          missing = [path for path in required if not (output / path).is_file()]
          if missing:
              raise SystemExit("Missing build files: " + ", ".join(missing))

          version = os.environ["BUILD_VERSION"].removeprefix("v")
          interface = json.loads((output / "interface.json").read_text(encoding="utf-8"))
          if interface.get("version") != version:
              raise SystemExit(f"Package version mismatch: expected {version}, got {interface.get('version')}")
          source_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if source_sha != os.environ["SOURCE_SHA"]:
              raise SystemExit("Package source commit does not match the version metadata job.")
          (output / "build-info.json").write_text(
              json.dumps({"version": version, "source_commit": source_sha}, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Build output verified: {version} ({source_sha})")

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MaaNTE-win-${{ matrix.arch }}-${{ env.BUILD_VERSION }}-MXU
          path: "install-mxu"
          if-no-files-found: error
          retention-days: 14

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          # 正式版：使用 tag-pattern 只匹配正式版标签，包含所有从上一个正式版以来的提交
          # 预发布版：正常生成，只包含从上一个标签以来的提交
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Check release notes
        shell: bash
        run: |
          test -s CHANGES.md
          cat CHANGES.md

      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Process and package artifacts
        shell: bash
        run: |
          artifact_dir="$PWD/downloaded-artifacts"
          release_dir="$PWD/release-assets"
          mkdir -p "$release_dir"

          for f in "$artifact_dir"/*; do
            artifact_name="$(basename "$f")"

            if [[ ! -d "$f" ]]; then
              echo "Skipping non-directory artifact entry: $artifact_name"
              continue
            fi

            if [[ $artifact_name == *"win"* ]]; then
              echo "Processing Windows artifact: $artifact_name"
              (cd "$f" && zip -r "$release_dir/$artifact_name.zip" .)
            else
              echo "Processing Unix artifact: $artifact_name"

              if [[ -f "$f/MaaPiCli" ]]; then
                chmod +x "$f/MaaPiCli"
                echo "Set execute permission for $artifact_name/MaaPiCli"
              fi

              find "$f" -type f -name "MFAUpdater*" -exec chmod +x {} \; 2>/dev/null || true
              echo "Set execute permission for all MFAUpdater files"

              if [[ -f "$f/MaaNTE" ]]; then
                chmod +x "$f/MaaNTE"
                echo "Set execute permission for $artifact_name/MaaNTE"
              fi

              for PYTHON_PATH in "$f/python/bin/python3" "$f/python/python" "$f/python/bin/python" "$f/python/python.exe"; do
                if [[ -f "$PYTHON_PATH" ]]; then
                  chmod +x "$PYTHON_PATH"
                  echo "Set execute permission for ${PYTHON_PATH#$artifact_dir/}"
                fi
              done

              tar -cpzf "$release_dir/$artifact_name.tar.gz" -C "$f" .
              echo "Created archive with preserved permissions: $artifact_name.tar.gz"
            fi
          done

          if [[ -z "$(find "$release_dir" -maxdepth 1 -type f -print -quit)" ]]; then
            echo "No release assets were created."
            exit 1
          fi

      - uses: softprops/action-gh-release@v2.2.2
        with:
          files: release-assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body_path: CHANGES.md
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

      - name: Trigger MirrorChyanUploading
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
